name: PR Checks

on:
  pull_request:
    branches:
      - staging
      - 'preview/**'

permissions:
  contents: read

jobs:
  # Lint and render every chart with the value files the target environment's
  # Applications name, so a broken chart fails here instead of on ArgoCD sync.
  charts:
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ github.base_ref == 'staging' && 'staging' || 'preview' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate charts
        run: bash scripts/ci/validate-charts.sh "$TARGET_ENV"

  # Warning-level findings and above in every shell script; an exclusion is an
  # inline `# shellcheck disable=` with its reason beside it.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

apiVersion: v1
kind: PersistentVolume
metadata:
  name: acer-local-1g-3
  labels:
    app: safezone-simulator
    type: full-data
spec:
  capacity:
    storage: 1Gi
  storageClassName: local-path
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: safezone
    name: simulator-data-pvc
  local:
    path: /mnt/k3s/pv/1g/3
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - acer-agent
